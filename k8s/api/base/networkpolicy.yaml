apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-config-api
  namespace: logging
spec:
  podSelector:
    matchLabels:
      app: tenant-config-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ocm-gateway
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - ports:
    - port: 443
      protocol: TCP
