apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector-logs
  namespace: logging
  labels:
    app: vector-logs
    app.kubernetes.io/name: vector
    app.kubernetes.io/part-of: multi-tenant-logging
    app.kubernetes.io/component: log-collector
spec:
  selector:
    matchLabels:
      app: vector-logs
  template:
    metadata:
      labels:
        app: vector-logs
    spec:
      serviceAccountName: vector-logs
      # Vector runs as uid 0 so its single required capability (DAC_READ_SEARCH,
      # see container securityContext) is effective. Kubernetes/CRI do not
      # populate the ambient capability set, so a capability added for a
      # non-root uid is dropped on exec and never takes effect; running as uid 0
      # with a single scoped capability and everything else dropped is the
      # least-privilege posture that actually works. See kubernetes#56374.
      securityContext:
        # NOTE: on OpenShift, setting a seccompProfile is only admitted if the
        # governing SCC lists it in .seccompProfiles; otherwise the pod is
        # rejected ("seccomp may not be set"). The production SCC must allow
        # RuntimeDefault, or this field must be omitted there.
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: vector
        image: quay.io/openshift-logging/vector:v0.47.0
        command: ["vector"]
        env:
        - name: VECTOR_CONFIG_YAML
          value: "/etc/vector/vector.yaml"
        - name: AWS_STS_REGIONAL_ENDPOINTS
          value: "regional"
        - name: VECTOR_SELF_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: VECTOR_LOG
          value: "WARN"
        - name: VECTOR_REQUIRE_HEALTHY
          value: "true"
        ports:
        - containerPort: 8686
          name: prometheus
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "2Gi"
            cpu: "200m"
        volumeMounts:
        - name: var-log
          mountPath: /var/log
          readOnly: true
        - name: var-lib-docker-containers
          mountPath: /var/lib/docker/containers
          readOnly: true
        - name: vector-config
          mountPath: /etc/vector
          readOnly: true
        - name: vector-data
          mountPath: /vector-data-dir
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsUser: 0
          capabilities:
            drop: ["ALL"]
            # Vector reads root-owned container log files under /var/log and
            # /var/lib/docker/containers. DAC_READ_SEARCH is the only capability
            # it needs to read and traverse those paths; everything else is
            # dropped and privilege escalation is disabled.
            add: ["DAC_READ_SEARCH"]
          # On OpenShift the kubelet does not SELinux-relabel hostPath volumes,
          # so a fully-confined (container_t) container is denied write to the
          # vector-data hostPath (Vector's disk-buffer ledger) and fails to
          # start. spc_t keeps the container SELinux-unconfined while every
          # capability except DAC_READ_SEARCH is dropped and privilege
          # escalation is off. (No-op on non-SELinux nodes such as CI kind.)
          seLinuxOptions:
            type: spc_t
      volumes:
      - name: var-log
        hostPath:
          path: /var/log
      - name: var-lib-docker-containers
        hostPath:
          path: /var/lib/docker/containers
      - name: vector-config
        configMap:
          name: vector-config
      # Vector's data_dir (checkpoints + disk buffer). A writable hostPath keeps
      # the buffer durable across pod recreation on node reboots, so logs
      # buffered during S3 backpressure survive (e.g. machineconfig rollouts).
      - name: vector-data
        hostPath:
          path: /var/lib/vector-data
          type: DirectoryOrCreate
      tolerations:
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists