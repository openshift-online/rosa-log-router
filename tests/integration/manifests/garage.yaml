apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: logging
data:
  garage.toml: |
    metadata_dir = "/tmp/meta"
    data_dir = "/tmp/data"

    # Single-node test setup (v2.4.1 format)
    # For single-node, replication_factor=1 means no replication
    # consistency_mode is only needed when replication_factor > 1
    replication_factor = 1

    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "127.0.0.1:3901"
    rpc_secret = "1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef"

    [s3_api]
    s3_region = "us-east-1"
    api_bind_addr = "[::]:3900"
    root_domain = ".s3.garage.localhost"

    [s3_web]
    bind_addr = "[::]:3902"
    root_domain = ".web.garage.localhost"

    [admin]
    api_bind_addr = "[::]:3903"

---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: logging
  labels:
    app: s3-storage
spec:
  selector:
    app: s3-storage
  ports:
  - name: s3-api
    port: 9000
    targetPort: 3900
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: s3-storage
  namespace: logging
  labels:
    app: s3-storage
spec:
  selector:
    app: s3-storage
  ports:
  - name: s3-api
    port: 3900
    targetPort: 3900
  - name: admin
    port: 3903
    targetPort: 3903
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3-storage
  namespace: logging
  labels:
    app: s3-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3-storage
  template:
    metadata:
      labels:
        app: s3-storage
    spec:
      containers:
      - name: garage
        image: dxflrs/garage:v2.4.1
        imagePullPolicy: IfNotPresent
        command:
        - /garage
        args:
        - -c
        - /etc/garage.toml
        - server
        env:
        - name: RUST_LOG
          value: "garage=info"
        ports:
        - containerPort: 3900
          name: s3-api
        - containerPort: 3901
          name: rpc
        - containerPort: 3902
          name: web
        - containerPort: 3903
          name: admin
        volumeMounts:
        - name: config
          mountPath: /etc/garage.toml
          subPath: garage.toml
        - name: data
          mountPath: /tmp/data
        - name: meta
          mountPath: /tmp/meta
        readinessProbe:
          httpGet:
            path: /health
            port: 3903
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health
            port: 3903
          initialDelaySeconds: 90
          periodSeconds: 10
          failureThreshold: 6
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: config
        configMap:
          name: garage-config
      - name: data
        emptyDir: {}
      - name: meta
        emptyDir: {}

---
apiVersion: batch/v1
kind: Job
metadata:
  name: s3-setup
  namespace: logging
  labels:
    app: s3-setup
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: garage-setup
        image: amazon/aws-cli:latest
        imagePullPolicy: IfNotPresent
        command:
        - /bin/bash
        - -c
        args:
        - |
          set -e

          # Wait for Garage admin port to be accessible
          # Note: /health returns 503 until configured, so just check port accessibility
          echo "Waiting for Garage admin API port to be accessible..."
          until nc -z s3-storage 3903 2>/dev/null; do
            echo "Waiting for port 3903..."
            sleep 5
          done

          echo "Garage admin port is accessible, starting configuration..."

          # Get Garage node ID from status API
          NODE_ID=$(wget -q -O- http://s3-storage:3903/v0/status 2>/dev/null | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)

          if [ -z "$NODE_ID" ]; then
            echo "ERROR: Could not get Garage node ID"
            exit 1
          fi

          echo "Garage node ID: $NODE_ID"

          # Configure Garage layout (assign storage capacity)
          echo "Configuring Garage layout..."
          wget -q -O- --post-data="{\"id\":\"$NODE_ID\",\"capacity\":10000000000,\"zone\":\"default\",\"tags\":[\"test\"]}" \
            --header="Content-Type: application/json" \
            http://s3-storage:3903/v0/layout 2>/dev/null || echo "Layout may already be configured"

          # Apply layout
          echo "Applying Garage layout..."
          wget -q -O- --post-data='{"version":1}' \
            --header="Content-Type: application/json" \
            http://s3-storage:3903/v0/layout/apply 2>/dev/null || echo "Layout apply may have already completed"

          # Create S3 access key (use testadmin for consistency with existing workloads)
          echo "Creating S3 access key..."
          wget -q -O- --post-data='{"name":"test-key"}' \
            --header="Content-Type: application/json" \
            http://s3-storage:3903/v0/key 2>/dev/null || echo "Key may already exist"

          # Import the testadmin key (for compatibility with existing configs)
          echo "Importing testadmin credentials..."
          wget -q -O- --post-data='{"accessKeyId":"testadmin","secretAccessKey":"testadmin","name":"testadmin"}' \
            --header="Content-Type: application/json" \
            http://s3-storage:3903/v0/key/import 2>/dev/null || echo "testadmin key may already exist"

          # Configure AWS CLI with testadmin credentials
          export AWS_ACCESS_KEY_ID=testadmin
          export AWS_SECRET_ACCESS_KEY=testadmin
          export AWS_DEFAULT_REGION=us-east-1

          # Wait a bit for S3 API to be ready with new credentials
          sleep 10

          # Create buckets
          echo "Creating S3 buckets..."
          for bucket in test-logs customer-logs acme-corp-logs multi-delivery-bucket; do
            echo "Creating bucket: $bucket"
            aws s3 mb "s3://$bucket" --endpoint-url=http://minio:9000 || echo "Bucket $bucket may already exist"

            # Grant access to testadmin key for this bucket
            echo "Granting testadmin access to $bucket..."
            wget -q -O- --post-data="{\"accessKeyId\":\"testadmin\",\"permissions\":{\"read\":true,\"write\":true,\"owner\":true}}" \
              --header="Content-Type: application/json" \
              "http://s3-storage:3903/v0/bucket/$bucket/allow" 2>/dev/null || echo "Permission may already be granted"
          done

          echo "Garage S3 setup complete!"
          echo "Created buckets: test-logs, customer-logs, acme-corp-logs, multi-delivery-bucket"
          echo "Credentials: testadmin / testadmin"
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "100m"
