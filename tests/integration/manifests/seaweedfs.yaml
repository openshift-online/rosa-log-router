apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
  namespace: logging
type: Opaque
stringData:
  access-key: "admin"
  secret-key: "admin123"

---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: logging
  labels:
    app: s3-storage
spec:
  selector:
    app: s3-storage
  ports:
  - name: s3-api
    port: 9000
    targetPort: 8333
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3-storage
  namespace: logging
  labels:
    app: s3-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3-storage
  template:
    metadata:
      labels:
        app: s3-storage
    spec:
      containers:
      - name: seaweedfs
        image: chrislusf/seaweedfs:latest
        imagePullPolicy: IfNotPresent
        command:
        - /usr/bin/weed
        args:
        - server
        - -s3
        - -s3.port=8333
        - -dir=/data
        env:
        - name: WEED_S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: s3-credentials
              key: access-key
        - name: WEED_S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: s3-credentials
              key: secret-key
        ports:
        - containerPort: 8333
          name: s3-api
        - containerPort: 9333
          name: master
        - containerPort: 8080
          name: volume
        volumeMounts:
        - name: data
          mountPath: /data
        readinessProbe:
          httpGet:
            path: /
            port: 9333
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 9333
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "300m"
      volumes:
      - name: data
        emptyDir: {}

---
apiVersion: batch/v1
kind: Job
metadata:
  name: s3-setup
  namespace: logging
  labels:
    app: s3-setup
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: aws-cli
        image: amazon/aws-cli:latest
        imagePullPolicy: IfNotPresent
        command:
        - /bin/bash
        - -c
        args:
        - |
          # Configure AWS CLI for SeaweedFS
          aws configure set aws_access_key_id admin
          aws configure set aws_secret_access_key admin123
          aws configure set region us-east-1

          # Wait for S3 service to be ready
          until aws s3 ls --endpoint-url=http://minio:9000 2>/dev/null; do
            echo "Waiting for S3 service to be ready..."
            sleep 5
          done

          # Create source bucket (where Vector writes logs)
          aws s3 mb s3://test-logs --endpoint-url=http://minio:9000 || true
          echo "Created source bucket: test-logs"

          # Create destination buckets (where processor copies logs)
          aws s3 mb s3://customer-logs --endpoint-url=http://minio:9000 || true
          echo "Created destination bucket: customer-logs"

          aws s3 mb s3://acme-corp-logs --endpoint-url=http://minio:9000 || true
          echo "Created destination bucket: acme-corp-logs"

          aws s3 mb s3://multi-delivery-bucket --endpoint-url=http://minio:9000 || true
          echo "Created destination bucket: multi-delivery-bucket"

          echo "S3 setup complete with source and destination buckets"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
